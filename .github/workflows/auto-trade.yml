name: Aurora Auto Trade
on:
  schedule:
    # BJT = UTC+8
    # 09:25 BJT = 01:25 UTC �?集合竞价后选股
    - cron: '25 1 * * 1-5'
    # 09:30 BJT = 01:30 UTC �?晨报推�?    - cron: '30 1 * * 1-5'
    # 盘中�?0分钟 (09:35-11:30 = 01:35-03:30 UTC, 13:00-15:00 = 05:00-07:00 UTC)
    - cron: '*/10 1-3 * * 1-5'
    - cron: '*/10 5-7 * * 1-5'
    # 15:05 BJT = 07:05 UTC �?收盘复盘
    - cron: '5 7 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: '运行阶段'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - monitor
          - review
          - full

env:
  SCT_TOKEN: ${{ secrets.SCT_TOKEN }}

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install -q requests pyyaml pandas numpy
          # 尝试安装歪枣�?可�?
          pip install -q waizao 2>/dev/null || true
      
      - name: 恢复缓存数据(持仓/策略统计)
        uses: actions/cache@v4
        with:
          path: data/
          key: aurora-data-${{ github.run_id }}
          restore-keys: |
            aurora-data-
      
      - name: 判断运行阶段
        id: phase
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "phase=${{ github.event.inputs.phase }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            if [ "$MIN" = "25" ] && [ "$HOUR" = "01" ]; then
              echo "phase=morning" >> $GITHUB_OUTPUT
            elif [ "$MIN" = "30" ] && [ "$HOUR" = "01" ]; then
              echo "phase=morning" >> $GITHUB_OUTPUT
            elif [ "$MIN" = "05" ] && [ "$HOUR" = "07" ]; then
              echo "phase=review" >> $GITHUB_OUTPUT
            else
              echo "phase=monitor" >> $GITHUB_OUTPUT
            end if  # 修复: 应该用fi
          fi
      
      - name: 运行每日流程
        env:
          WZ_TOKEN: ${{ secrets.WZ_TOKEN }}
        run: python daily_run.py --phase ${{ steps.phase.outputs.phase }}
      
      - name: 保存数据缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: aurora-data-${{ github.run_id }}
      
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-logs-${{ github.run_id }}
          path: |
            data/aurora.log
            data/reports/
          retention-days: 7
          if-no-files-found: ignore
