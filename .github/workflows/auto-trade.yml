name: Aurora Auto Trade
on:
  schedule:
    # 集合竞价后选股 (工作日 09:25 BJT = 01:25 UTC)
    - cron: '25 1 * * 1-5'
    # 盘中每10分钟监控+做T (09:35-11:30, 13:00-15:00 BJT)
    - cron: '*/10 1-3 * * 1-5'
    - cron: '*/10 5-7 * * 1-5'
    # 收盘复盘 (15:05 BJT = 07:05 UTC)
    - cron: '5 7 * * 1-5'
  workflow_dispatch:
env:
  SCT_TOKEN: ${{ secrets.SCT_TOKEN }}
  PHASE: ${{ github.event.schedule }}
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests pyyaml pandas numpy
      - name: Determine phase
        id: phase
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          if [ "$MIN" = "25" ] && [ "$HOUR" = "01" ]; then echo "phase=auction" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "07" ] && [ "$MIN" = "05" ]; then echo "phase=review" >> $GITHUB_OUTPUT
          else echo "phase=monitor" >> $GITHUB_OUTPUT
          fi
      - name: Run workflow
        run: python daily_run.py --phase ${{ steps.phase.outputs.phase }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: data, path: data/, retention-days: 3, if-no-files-found: ignore}