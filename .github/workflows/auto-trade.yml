name: Aurora Auto Trade
on:
  workflow_dispatch:  # 仅手动触发 (定时已禁用, 避免刷屏推送)
env:
  SCT_TOKEN: ${{ secrets.SCT_TOKEN }}
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests pyyaml pandas numpy
      - name: Run workflow
        run: python daily_run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: data, path: data/, retention-days: 3, if-no-files-found: ignore}