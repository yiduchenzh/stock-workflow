name: Aurora Auto Trade

'on':
  schedule:
    - cron: '25 1 * * 1-5'
    - cron: '30 1 * * 1-5'
    - cron: '*/10 1-3 * * 1-5'
    - cron: '*/10 5-7 * * 1-5'
    - cron: '5 7 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: Run phase
        required: true
        default: morning
        type: choice
        options:
          - morning
          - monitor
          - review
          - full

env:
  SCT_TOKEN: ${{ secrets.SCT_TOKEN }}

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deps
        run: pip install -q requests pyyaml pandas numpy
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: aurora-data-${{ github.run_id }}
          restore-keys: aurora-data-
      - name: Determine phase
        id: phase
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "phase=${{ github.event.inputs.phase }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            if [ "$MIN" = "25" ] && [ "$HOUR" = "01" ]; then
              echo "phase=morning" >> $GITHUB_OUTPUT
            elif [ "$MIN" = "30" ] && [ "$HOUR" = "01" ]; then
              echo "phase=morning" >> $GITHUB_OUTPUT
            elif [ "$MIN" = "05" ] && [ "$HOUR" = "07" ]; then
              echo "phase=review" >> $GITHUB_OUTPUT
            else
              echo "phase=monitor" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Run workflow
        env:
          WZ_TOKEN: ${{ secrets.WZ_TOKEN }}
        run: python daily_run.py --phase ${{ steps.phase.outputs.phase }}
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: aurora-data-${{ github.run_id }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-logs-${{ github.run_id }}
          path: data/aurora.log
          retention-days: 7
          if-no-files-found: ignore
