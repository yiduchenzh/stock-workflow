[project]
name = "aurora-trading"
version = "1.0.0"
description = "A股全自动交易系统 — 十三步闭环无人值守"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "PySide6>=6.5",
]

[project.optional-dependencies]
broker = ["pywinauto>=0.6.9"]

[project.scripts]
aurora = "core.engine:main"
aurora-desktop = "desktop.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]